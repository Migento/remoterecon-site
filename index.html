<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Recon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1c2433,#0b0e14 70%);color:#e6e9ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2rem;text-align:center}
main{max-width:640px}
h1{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:700;letter-spacing:-0.02em;background:linear-gradient(90deg,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:1.25rem;font-size:clamp(1.05rem,2.5vw,1.3rem);color:#aab3c5;line-height:1.6}
a{color:#7dd3fc;text-decoration:none;border-bottom:1px solid rgba(125,211,252,.4)}
a:hover{border-bottom-color:#7dd3fc}
.contact{margin-top:2.5rem;font-size:1rem;color:#7c869a}
form{margin:2rem auto 0;display:grid;gap:.8rem;text-align:left;max-width:460px}
label{font-size:.85rem;color:#aab3c5}
input,textarea{width:100%;margin-top:.3rem;padding:.75rem .9rem;border-radius:10px;border:1px solid #2a3344;background:#121722;color:#e6e9ef;font:inherit}
input:focus,textarea:focus{outline:none;border-color:#7dd3fc}
button{margin-top:.4rem;padding:.8rem;border:0;border-radius:10px;font:inherit;font-weight:600;color:#0b0e14;background:linear-gradient(90deg,#7dd3fc,#a78bfa);cursor:pointer}
h2{margin-top:2.5rem;font-size:1.3rem;color:#e6e9ef}
</style>
</head>
<body>
<main>
<h1>Remote Recon</h1>
<p>Our new website is coming soon.</p>
<h2>Contact us</h2>
<form action="https://formsubmit.co/hello@remoterecon.ca" method="POST">
<input type="hidden" name="_subject" value="New message from remoterecon.ca">
<input type="hidden" name="_template" value="table">
<input type="text" name="_honey" style="display:none">
<label>Name<input type="text" name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Message<textarea name="message" rows="5" required></textarea></label>
<button type="submit">Send message</button>
</form>
<p class="contact">Or email us at <a href="mailto:hello@remoterecon.ca">hello@remoterecon.ca</a></p>
</main>
</body>
</html>
